<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>SkillBridge – AI-Based Personalized Student Skill Development</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f1f5fa;--cd:#fff;--tx:#17263a;--mu:#6a7b90;--bd:#e1e8f1;--nv:#0b2a5e;--nv2:#12356f;--pr:#1f63e0;--tl:#16b3a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1622;--cd:#172334;--tx:#e6edf5;--mu:#97a6b8;--bd:#25354b}}
:root[data-theme="dark"]{--bg:#0e1622;--cd:#172334;--tx:#e6edf5;--mu:#97a6b8;--bd:#25354b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
header{background:linear-gradient(90deg,#0a2554,#12356f);color:#fff;height:56px;padding:0 18px;display:flex;align-items:center;gap:10px}
header img{width:36px;height:36px}header b{font-size:18px;display:block;line-height:1.1}header small{font-size:10px;opacity:.75}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px}.av{width:30px;height:30px;border-radius:50%;background:#f0b27a;color:#4a2a10;display:flex;align-items:center;justify-content:center;font-weight:700}
.wrap{display:flex;min-height:calc(100vh - 56px)}nav{width:172px;background:var(--nv);flex:none;padding-top:8px}
nav a{display:flex;gap:10px;color:#c5d6f0;padding:10px 16px;cursor:pointer;font-size:12.5px}nav a.on{background:#2a66d9;color:#fff}nav a span{width:14px;text-align:center}
main{flex:1;padding:18px 22px;min-width:0}h2{margin:0;font-size:20px}.sub{color:var(--mu);margin:2px 0 14px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}.cd>h3,.t{margin:0 0 10px;font-size:14px;font-weight:700}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.st small{color:var(--mu);font-size:11.5px;display:block}.st b{font-size:26px;color:var(--nv)}.up{color:var(--tl);font-size:12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th{background:#e9f3fb;color:#31465e;text-align:left;font-size:12px}th,td{padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
.pill{display:inline-block;padding:2px 10px;border-radius:5px;font-size:11px;font-weight:600}
.Matched,.Advanced,.Completed,.Highly{background:#d9f2e6;color:#1a7f52}.Developing,.Intermediate,.Medium,.Moderate,.Basic{background:#fdeccb;color:#a8660a}.SkillGap,.Missing,.High,.Beginner{background:#fbdada;color:#b42323}.Suitable,.InProgress{background:#dbe9fd;color:#1c55b8}.NotStarted{background:#eceff3;color:#66768a}
.bars{display:flex;align-items:flex-end;gap:18px;height:190px;padding-top:10px;border-left:1px solid var(--bd);border-bottom:1px solid var(--bd)}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:block;border-radius:3px 3px 0 0;margin:0 auto;width:26px}.lab{display:flex;gap:18px;margin-top:4px}.lab span{flex:1;text-align:center;font-size:10.5px;color:var(--mu)}
.act{display:flex;gap:10px;margin:0 0 12px}.act i{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:none}.act small{color:var(--mu);display:block}
.chip{display:inline-block;background:#e3eefc;color:#1c55b8;border-radius:5px;padding:3px 10px;margin:2px;font-size:12px}
label{font-weight:600;display:block;margin-top:8px}input[type=text],input[type=password],textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:6px;background:var(--cd);color:var(--tx);font:inherit;margin:4px 0}
button{background:var(--pr);color:#fff;border:0;border-radius:6px;padding:9px 20px;font:600 13px inherit;cursor:pointer}button.sec{background:var(--cd);color:var(--pr);border:1px solid var(--bd)}button.w{width:100%;padding:11px}
.bar{height:8px;background:#e5ecf4;border-radius:5px;overflow:hidden;display:inline-block;width:100%;vertical-align:middle}.bar i{display:block;height:100%;background:var(--tl)}
.ring{--p:68;width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--c,#14b8a6) calc(var(--p)*1%),#e5ecf4 0);display:flex;align-items:center;justify-content:center;flex:none}.ring span{width:96px;height:96px;border-radius:50%;background:var(--cd);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:700;text-align:center}.ring small{font-size:10px;font-weight:400;color:var(--mu)}
.opt{display:flex;gap:10px;align-items:center;padding:8px 4px;cursor:pointer;font-size:14px}.opt u{width:16px;height:16px;border:2px solid #9bb0c8;border-radius:50%;flex:none}.opt.s u{border-color:var(--pr);background:radial-gradient(var(--pr) 45%,transparent 50%)}
.ok{background:#e1f5ec;color:#1a7f52;padding:8px 12px;border-radius:6px;margin-top:10px}.ph{font-size:12px;color:var(--mu)}
.lg{display:flex;min-height:100vh}.lp{flex:1.1;background:linear-gradient(160deg,#0a2554,#12408a);color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:center}.lp h1{margin:8px 0 2px;font-size:34px}.lp .ill{margin-top:26px;font-size:80px}
.rp{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--cd)}.rp>div{width:100%;max-width:340px}.tabs{display:flex;gap:20px;margin-bottom:14px;color:var(--mu)}.tabs b{color:var(--pr);border-bottom:2px solid var(--pr);padding-bottom:4px}.tabs span{cursor:pointer}
.alt{border:1px solid var(--bd);border-radius:6px;padding:9px;text-align:center;margin:8px 0;cursor:pointer}
@media(max-width:700px){.wrap{display:block}nav{width:100%;display:flex;overflow-x:auto;padding:0}nav a{white-space:nowrap}.lg{display:block}.lp{padding:24px}}
</style></head><body><div id="app"></div>

jd:()=>hd('Job Description Input')+`<div class="cd"><label>Job Title *</label><input type="text" id="t" value="${S.title}"><label>Company Name *</label><input type="text" id="c" value="${S.company}"><label>Description *</label><textarea id="d" rows="5">${S.jd}</textarea><label>Required Qualifications</label><div>${['Python','SQL','Power BI','Data Analysis','Communication'].map(x=>`<span class="chip">${x}</span>`).join('')}</div><br><button class="w" onclick="doJD()">Submit</button></div>`,
jdr:()=>hd('Extracted Skills from Job Description')+`<div class="cd"><b>Job Title:</b> ${S.title} &nbsp;&nbsp; <b>Company:</b> ${S.company}</div><div class="cd" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:240px"><h3>Identified Skills</h3>${tb(['Skill','Category'],S.req.map(k=>[k,SK[k][0]]))}</div><div class="ring" style="--p:100;--c:#2d7de0"><span>${S.req.length}<small>Skills Extracted</small></span></div></div><div class="ok">✔ Skills extracted successfully using NLP and TF-IDF</div><br><button class="sec" onclick="go('jd')">Edit description</button> <button onclick="go('gap')">View skill gap</button>`,
quiz:()=>{if(S.qi>=Q.length)return P.res();const q=Q[S.qi];return hd('Student Skill Assessment')+`<div class="cd"><span class="ph">Question ${S.qi+1} of ${Q.length}</span><div class="bar" style="margin:6px 0 18px"><i style="width:${(S.qi+1)/Q.length*100}%;background:var(--pr)"></i></div><p style="font-weight:600;font-size:14px">${q[0]}</p>${q[1].map((o,i)=>`<div class="opt ${S.ans[S.qi]===i?'s':''}" onclick="S.ans[S.qi]=${i};render()"><u></u>${o}</div>`).join('')}<br><div style="display:flex;justify-content:space-between"><button class="sec" onclick="S.qi=Math.max(0,S.qi-1);render()">Previous</button><button onclick="nextQ()">${S.qi==Q.length-1?'Finish':'Next'}</button></div></div>`},
res:()=>{const ks=['Python','SQL','Power BI','Excel'];return hd('Assessment Result')+`<div class="g2"><div class="cd" style="display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap"><div class="ring" style="--p:${pct()}"><span>${pct()}%<small>Overall Score</small></span></div>${pl(L[Math.max(1,lvl(pct()))],L[Math.max(1,lvl(pct()))])}</div><div class="cd"><h3>Skill-wise Performance</h3>${tb(['Skill Area','Score','Level'],ks.map(k=>[k,(S.sp[k]??0)+'%',pl(L[lv(k)])]))}</div></div><div class="ok" style="background:#e3eefc;color:#1c55b8">Your assessment results are saved and will be used for skill gap analysis and personalized recommendations.</div><br><button class="sec" onclick="S.qi=0;S.ans=[];render()">Retake</button> <button onclick="go('gap')">View skill gap</button>`},
gap:()=>hd('Skill Gap Analysis')+`<div class="cd"><div style="text-align:right;margin-bottom:8px"><span class="chip">Job Role: ${S.title} ›</span></div>${tb(['Required Skill','Student Level','Status'],gaps().map(x=>[x.k,L[x.l],pl(x.st)]))}<p>${pl('Matched')} Matched &nbsp; ${pl('Developing')} Developing &nbsp; ${pl('Missing')} Missing</p></div>`,
rec:()=>{const g=gaps().filter(x=>x.g).sort((a,b)=>b.g-a.g);return hd('Personalized Skill Recommendations','Based on your skill gaps and career goals')+`<div class="cd">${g.length?tb(['Skill Gap','Current Level','Recommendation','Priority'],g.map(x=>[x.k,L[x.l],x.l?x.k+' '+REC[x.l]:x.k+' fundamentals + beginner exercises',pl(x.g>1?'High':'Medium')])):'All required skills matched. Great work!'}</div><div class="cd"><h3>Learning Path</h3>Learn → Practice → Build Project → Get Certified</div>`},
prog:()=>{sync();const t=S.track,d=t.filter(k=>S.prog[k]==100).length,ty=['Video Course','Practice','Project'];return hd('My Learning Progress')+`<div class="cd" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><b style="font-size:24px">${d} / ${t.length}</b><span>Completed</span><div style="flex:1;min-width:120px"><div class="bar"><i style="width:${t.length?d/t.length*100:0}%;background:var(--pr)"></i></div></div><span>${t.length?Math.round(d/t.length*100):0}%</span><span class="ph">Target: 3 months</span></div><div class="cd">${t.length?tb(['Skill / Resource','Type','Progress','Status',''],t.map((k,i)=>{const p=S.prog[k]||0;return[k+(i?' Practice':' Basics'),ty[i%3],`<span style="display:inline-block;width:110px"><span class="bar"><i style="width:${p}%"></i></span></span> ${p}%`,pl(p==100?'Completed':p?'In Progress':'Not Started'),`<button class="sec" ${p==100?'disabled':''} onclick="adv('${k}')">${p?'Update':'Start'}</button>`]})):'No recommended learning yet.'}</div>`},
job:()=>hd('Suitable Job Roles for You')+`<div class="cd">${tb(['Job Role','Company','Match Score','Status'],match().map(([n,c,p])=>[n,c,p+'%',pl(sb(p))]))}</div><div class="cd"><h3>Why these roles?</h3>✔ Your skills match the required skills for the role<br>✔ Your interest aligns with the job requirements<br>✔ Based on your assessment performance</div>`,
adm:()=>hd('Admin Dashboard')+`<div class="g4">${[['Total Students',124],['Job Descriptions',48],['Companies',18],['Learning Resources',56]].map(c=>`<div class="cd st"><small>${c[0]}</small><b>${c[1]}</b></div>`).join('')}</div><div class="g2"><div class="cd"><h3>Recent Students</h3>${tb(['Name','Department','Status'],[['Ananya Sharma','CSE'],['Rahul Kumar','ECE'],['Priya Nair','CSE'],['Vikram Singh','ME'],['Sneha Reddy','ECE']].map(r=>[...r,pl('Active','Matched')]))}</div><div class="cd" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div><h3>Skill Distribution</h3>${[['Programming',32,'#2d7de0'],['Database',20,'#22b573'],['Tools',18,'#f59e0b'],['Soft Skills',15,'#ec4899'],['Others',15,'#8b5cf6']].map(r=>`<div><span style="color:${r[2]}">●</span> ${r[0]} ${r[1]}%</div>`).join('')}</div><div class="ring" style="--p:100;background:conic-gradient(#2d7de0 0 32%,#22b573 0 52%,#f59e0b 0 70%,#ec4899 0 85%,#8b5cf6 0)"><span style="width:70px;height:70px"></span></div></div></div>`};
function shell(h){const a=S.admin,nv=a?ANAV.map(x=>`<a class="${x=='Admin Panel'?'on':''}" onclick="go('adm')"><span>▪</span>${x}</a>`):NAV.map(([k,n,i])=>`<a class="${S.page==k||(k=='jd'&&S.page=='jdr')?'on':''}" onclick="go('${k}')"><span>${i}</span>${n}</a>`);
return`<header><img src="${LOGO}" alt="PSN"><div><b>SkillBridge</b><small>AI-Based Personalized Student Skill Development</small></div><div class="me"><div class="av">${a?'AD':'AS'}</div>${a?'Admin':'Ananya Sharma'} ▾ &nbsp;<a style="cursor:pointer;text-decoration:underline" onclick="go('login')">Logout</a></div></header><div class="wrap"><nav>${nv.join('')}</nav><main>${h}</main></div>`}
function render(){document.getElementById('app').innerHTML=S.page=='login'?P.login():shell(P[S.page]());scrollTo(0,0)}
function go(p){S.page=p;render()}
function doJD(){S.title=t.value||'Job';S.company=c.value;S.jd=d.value;S.req=ext(S.jd);sync();log('Job description processed');go('jdr')}
function nextQ(){if(S.ans[S.qi]===undefined)return alert('Please select an answer');S.qi++;if(S.qi>=Q.length)finish();render()}
function finish(){const sc={};Q.forEach((q,i)=>{sc[q[3]]=sc[q[3]]||[0,0];sc[q[3]][1]++;if(S.ans[i]===q[2])sc[q[3]][0]++});let tot=0;Object.keys(sc).forEach(k=>{tot+=sc[k][0];S.sp[k]=Math.round(sc[k][0]/sc[k][1]*100)});S.score=Math.round(tot/Q.length*100);sync();log('Assessment completed')}
function adv(k){const p=S.prog[k]||0;S.prog[k]=p==0?40:p<70?70:100;if(S.prog[k]==100)S.sp[k]=Math.max(S.sp[k]||0,60);log('Learning progress updated: '+k);render()}
S.req=ext(S.jd);sync();render();
</script></body></html>
